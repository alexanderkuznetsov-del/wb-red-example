# Включает сохранение retained-сообщений на диск, чтобы флаг роли/VIP/
# приоритета переживал перезапуск самого mosquitto (не только перезапуск
# wb-rules/keepalived).
#
# ВАЖНО: не дублировать persistence_location - он уже задан в основном
# /etc/mosquitto/mosquitto.conf. Повторное указание роняет весь брокер
# ("Duplicate persistence_location value").
persistence true
autosave_interval 60
