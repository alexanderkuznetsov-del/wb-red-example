# Включает сохранение retained-сообщений на диск, чтобы роль, VIP и приоритет
# сохранялись при перезапуске mosquitto.
#
# Внимание: не указывайте persistence_location повторно. Он уже задан в
# /etc/mosquitto/mosquitto.conf, и при повторном указании брокер не запустится
# ("Duplicate persistence_location value").
persistence true
autosave_interval 60
